name: BDSA ticket watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test push to my phone
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .state
          key: bdsa-state-${{ github.run_id }}
          restore-keys: bdsa-state-
      - run: python3 check.py ${{ inputs.test_alert && '--test-alert' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
